services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: rebel_postgres
    environment:
      POSTGRES_USER: rebel
      POSTGRES_PASSWORD: rebel_password
      POSTGRES_DB: rebel_music
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebel -d rebel_music"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: rebel_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped

  # MongoDB (existing - for user/auth data)
  mongodb:
    image: mongo:6
    container_name: rebel_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: rebel
      MONGO_INITDB_ROOT_PASSWORD: rebel_password
      MONGO_INITDB_DATABASE: rebel
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped

  # Redis (optional - for caching & job queue)
  redis:
    image: redis:7-alpine
    container_name: rebel_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  mongodb_data:
  redis_data:

networks:
  default:
    name: rebel_network