services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "5001:5001"
    volumes:
      - ./data:/app/data
      - ./devnet-keypair.json:/app/devnet-keypair.json:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:5001
    ports:
      - "5173:80"
    depends_on:
      - api
