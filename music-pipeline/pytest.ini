[pytest]
testpaths = tests
markers =
    phase6_legacy: tests written against APIs that do not exist in the pipeline (extract_core_features, upsert_embedding, api.similarity._get_qdrant_client...) and that mock PostgreSQL/Qdrant/CLAP. Excluded by default until rewritten in plan phase 6. Run with: pytest -m phase6_legacy
    e2e: real end-to-end run against a live stack (PostgreSQL, Redis, Qdrant, API, workers). Needs REBEL_E2E_API_URL. Run with: pytest -m e2e tests/e2e
    e2e_youtube: real YouTube search + download + full analysis (production path). Needs REBEL_E2E_API_URL and YouTube access. Run with: pytest -m e2e_youtube tests/e2e
addopts = -m "not phase6_legacy and not e2e and not e2e_youtube"
