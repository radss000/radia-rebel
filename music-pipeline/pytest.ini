[pytest]
testpaths = tests
markers =
    phase6_legacy: tests written against APIs that do not exist in the pipeline (extract_core_features, upsert_embedding, api.similarity._get_qdrant_client...) and that mock PostgreSQL/Qdrant/CLAP. Excluded by default until rewritten in plan phase 6. Run with: pytest -m phase6_legacy
addopts = -m "not phase6_legacy"
